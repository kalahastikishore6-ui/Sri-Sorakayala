<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bag Price Calculator</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
      transition:0.3s;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    /* DARK THEME */

    body.dark{
      background:#0f172a;
      color:white;
    }

    body.dark .container{
      background:#1e293b;
    }

    body.dark input{
      background:#334155;
      color:white;
    }

    body.dark .result{
      background:#0f172a;
    }

    /* LIGHT THEME */

    body.light{
      background:#f1f5f9;
      color:#111827;
    }

    body.light .container{
      background:white;
    }

    body.light input{
      background:#e2e8f0;
      color:black;
    }

    body.light .result{
      background:#f8fafc;
    }

    .container{
      width:100%;
      max-width:420px;
      padding:25px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .title h1{
      font-size:26px;
    }

    .title p{
      font-size:13px;
      color:gray;
      margin-top:4px;
    }

    .theme-btn{
      border:none;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      background:#38bdf8;
      color:#111827;
    }

    .input-group{
      margin-bottom:16px;
    }

    label{
      display:block;
      margin-bottom:7px;
      font-size:14px;
    }

    input{
      width:100%;
      padding:13px;
      border:none;
      border-radius:10px;
      outline:none;
      font-size:15px;
    }

    button.calculate-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#38bdf8;
      color:#111827;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }

    button.calculate-btn:hover{
      transform:scale(1.02);
    }

    .result{
      margin-top:22px;
      padding:20px;
      border-radius:14px;
      text-align:center;
    }

    .result h2{
      margin-bottom:18px;
      color:#38bdf8;
    }

    .gramage{
      font-size:18px;
      margin-bottom:12px;
      font-weight:bold;
    }

    .final{
      font-size:28px;
      font-weight:bold;
      color:#22c55e;
    }

  </style>
</head>

<body class="dark">

  <div class="container">

    <div class="top-bar">

      <div class="title">
        <h1>Bag Price Calculator</h1>
      
      </div>

      <button class="theme-btn" onclick="toggleTheme()">
        Theme
      </button>

    </div>

    <div class="input-group">
      <label>Width</label>
      <input type="number" id="width" placeholder="Enter width">
    </div>

    <div class="input-group">
      <label>Gram</label>
      <input type="number" id="gram" placeholder="Enter gram">
    </div>

    <div class="input-group">
      <label>Length</label>
      <input type="number" id="length" placeholder="Enter length">
    </div>

    <div class="input-group">
      <label>Price Per KG</label>
      <input type="number" id="price" placeholder="Enter price per kg">
    </div>

    <div class="input-group">
      <label>Tax Percentage (%)</label>
      <input type="number" id="tax" placeholder="Enter tax percentage">
    </div>

    <button class="calculate-btn" onclick="calculatePrice()">
      Calculate
    </button>

    <div class="result" id="resultBox" style="display:none;">

      <h2>Calculation Result</h2>

      <div class="gramage" id="gramageBag"></div>

      <div class="final" id="finalOutput"></div>

    </div>

  </div>

  <script>

    function calculatePrice(){

      let width = parseFloat(document.getElementById("width").value) || 0;
      let gram = parseFloat(document.getElementById("gram").value) || 0;
      let length = parseFloat(document.getElementById("length").value) || 0;
      let price = parseFloat(document.getElementById("price").value) || 0;
      let tax = parseFloat(document.getElementById("tax").value) || 0;

      // price + tax
      let pt = price + (price * tax / 100);

      // width * gram
      let r1 = width * gram;

      // r1 / 39.2
      let r2 = r1 / 39.2;

      // r2 * length = Gramage of Bag
      let gramageBag = r2 * length;

      // r3 / 1000
      let r4 = gramageBag / 1000;

      // final output
      let final = r4 * pt;

      document.getElementById("resultBox").style.display = "block";

      document.getElementById("gramageBag").innerHTML =
        "Gramage of Bag : " + gramageBag.toFixed(2);

      document.getElementById("finalOutput").innerHTML =
        "₹ " + final.toFixed(2);

    }

    function toggleTheme(){

      let body = document.body;

      if(body.classList.contains("dark")){
        body.classList.remove("dark");
        body.classList.add("light");
      }
      else{
        body.classList.remove("light");
        body.classList.add("dark");
      }

    }

  </script>

</body>
</html>
